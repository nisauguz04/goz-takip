<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Göz Yorgunluğu Takibi</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:520px;margin:0 auto;padding:16px;line-height:1.5}
  button,select{font-size:1rem;padding:12px 18px;margin:6px 0;width:100%;border-radius:8px;border:1px solid #888}
  #goster{font-size:1.1rem;padding:10px;background:#8883;border-radius:8px}
  video{width:100%;border-radius:8px;transform:scaleX(-1)}
  input[type=range]{width:100%}
  .gizli{display:none}
</style>
</head>
<body>
<h2>Göz Yorgunluğu Çalışması</h2>
<div id="giris">
  <p>Kamera görüntüsü kaydedilmez ve gönderilmez. Sadece göz kırpma sayısı ve sayısal değerler toplanır.</p>
  <label><input type="checkbox" id="izin"> Verilerimin araştırmada kullanılmasını kabul ediyorum.</label><br>
  <input id="kid" placeholder="Katılımcı kodu (ör. K01)" style="width:100%;padding:10px;margin:8px 0">
  <label>Oturum süresi:</label>
  <select id="sure">
    <option value="1" selected>1 dakika</option>
    <option value="5">5 dakika</option>
    <option value="10">10 dakika</option>
    <option value="20">20 dakika</option>
    <option value="30">30 dakika</option>
  </select>
  <p>İpucu: Yüzün iyi aydınlansın, kameraya düz bak, telefonu sabit tut.</p>
  <button id="basla">Başlat</button>
</div>
<video id="v" autoplay playsinline muted class="gizli"></video>
<div id="goster" class="gizli"></div>
<button id="bitir" class="gizli">Erken bitir</button>

<div id="anket" class="gizli">
  <p>Oturum bitti. Şu an gözlerin ne kadar yorgun? (0 = hiç, 100 = çok yorgun): <b id="deger">50</b></p>
  <input type="range" id="puan" min="0" max="100" value="50">
  <button id="gonder">Gönder</button>
  <button id="indir">CSV indir (yedek)</button>
</div>

<script type="module">
import {FaceLandmarker, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// Google Apps Script web uygulaması adresini buraya yapıştır:
const GONDERIM_URL = "https://script.google.com/macros/s/AKfycbxCNWMJxCgcadbocLY3KuHJnVeFkbV9S7Kjry6SDWT0Wb909MAOaEn_uDi95UUoobE2/exec";

// Kırpma ayarları (blendshape skoru 0-1 arası, 1 = göz tam kapalı)
const KAPALI_ESIK = 0.5, ACIK_ESIK = 0.35;
const MIN_MS = 40, MAX_MS = 800;   // bundan kısa/uzun kapanmalar kırpma sayılmaz
const SOL = [362,385,387,263,373,380], SAG = [33,160,158,133,153,144];

const $ = id => document.getElementById(id);
let lm, calisiyor = false, kayitlar = [];
let kapaliBas = null, kirpma = 0, toplam = 0, earlar = [];
let bas, dkBas, bitisMs, sonZaman = -1, yuzYok = 0;

const d = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const ear = (p,i) => (d(p[i[1]],p[i[5]]) + d(p[i[2]],p[i[4]])) / (2*d(p[i[0]],p[i[3]]));
$("puan").oninput = e => $("deger").textContent = e.target.value;

$("basla").onclick = async () => {
  if(!$("izin").checked || !$("kid").value.trim()){ alert("Kabul kutusunu işaretle ve kod gir."); return; }
  $("basla").textContent = "Yükleniyor...";
  const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  lm = await FaceLandmarker.createFromOptions(fileset, {
    baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"},
    runningMode:"VIDEO", numFaces:1, outputFaceBlendshapes:true
  });
  const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}});
  $("v").srcObject = stream;
  $("giris").classList.add("gizli");
  ["v","goster","bitir"].forEach(i => $(i).classList.remove("gizli"));
  bas = dkBas = Date.now();
  bitisMs = bas + (+$("sure").value) * 60000;
  calisiyor = true; dongu();
};

function kaydet(simdi, kismi){
  const sn = (simdi - dkBas) / 1000;
  if(kismi && sn < 15) return;            // çok kısa artık parçayı atla
  kayitlar.push({
    katilimci: $("kid").value.trim(),
    zaman: new Date().toLocaleTimeString("tr-TR"),
    ekran_suresi_dk: +((simdi-bas)/60000).toFixed(1),
    kirpma_dk: Math.round(kirpma * 60 / Math.max(sn, 1)),   // dakikaya çevrilmiş
    ort_ear: +(earlar.reduce((a,b)=>a+b,0)/Math.max(earlar.length,1)).toFixed(3)
  });
  kirpma = 0; earlar = []; dkBas = simdi;
}

function bitir(){
  if(!calisiyor) return;
  calisiyor = false;
  kaydet(Date.now(), true);
  $("v").srcObject.getTracks().forEach(t => t.stop());
  ["v","goster","bitir"].forEach(i => $(i).classList.add("gizli"));
  $("anket").classList.remove("gizli");
}
$("bitir").onclick = bitir;

function dongu(){
  if(!calisiyor) return;
  const v = $("v"), simdi = Date.now();
  if(v.readyState >= 2 && v.currentTime !== sonZaman){
    sonZaman = v.currentTime;
    const t = performance.now();
    const s = lm.detectForVideo(v, t);
    if(s.faceLandmarks.length){
      yuzYok = 0;
      const p = s.faceLandmarks[0];
      earlar.push((ear(p,SOL) + ear(p,SAG)) / 2);
      const c = s.faceBlendshapes[0].categories;
      const sol = c.find(x => x.categoryName === "eyeBlinkLeft").score;
      const sag = c.find(x => x.categoryName === "eyeBlinkRight").score;
      const bl = (sol + sag) / 2;
      if(bl > KAPALI_ESIK && kapaliBas === null) kapaliBas = t;
      else if(bl < ACIK_ESIK && kapaliBas !== null){
        const sure = t - kapaliBas;
        if(sure >= MIN_MS && sure <= MAX_MS){ kirpma++; toplam++; }
        kapaliBas = null;
      }
    } else { yuzYok++; kapaliBas = null; }
  }
  if(simdi - dkBas >= 60000) kaydet(simdi, false);
  if(simdi >= bitisMs){ bitir(); return; }

  const kalan = Math.max(0, Math.round((bitisMs - simdi)/1000));
  $("goster").textContent = (yuzYok > 30 ? "⚠ Yüzün görünmüyor! " : "") +
    `Kalan: ${Math.floor(kalan/60)}:${String(kalan%60).padStart(2,"0")} | Toplam kırpma: ${toplam}`;
  requestAnimationFrame(dongu);
}

$("gonder").onclick = async () => {
  const etiket = +$("puan").value;
  kayitlar.forEach(k => k.yorgunluk_etiketi = etiket);
  if(!GONDERIM_URL){ alert("Gönderim adresi tanımlı değil. CSV indir."); return; }
  try{
    await fetch(GONDERIM_URL, {method:"POST", mode:"no-cors", body:JSON.stringify(kayitlar)});
    alert("Gönderildi, teşekkürler!");
  }catch(e){ alert("Gönderilemedi, CSV indir."); }
};

$("indir").onclick = () => {
  const etiket = +$("puan").value;
  const satirlar = ["katilimci,zaman,ekran_suresi_dk,kirpma_dk,ort_ear,yorgunluk_etiketi",
    ...kayitlar.map(k => [k.katilimci,k.zaman,k.ekran_suresi_dk,k.kirpma_dk,k.ort_ear,etiket].join(","))];
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([satirlar.join("\n")], {type:"text/csv"}));
  a.download = "goz_verisi.csv"; a.click();
};
</script>
</body>
</html>
